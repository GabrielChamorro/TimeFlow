# Puerto del backend
server.port=8080

# MySQL: las credenciales sensibles se leen desde variables de entorno.
# DB_URL y DB_USER tienen valores locales seguros de conveniencia; DB_PASSWORD es obligatorio.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/teamflow_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# Migracion mayor Hibernate 6 -> 7: evitar cambios de esquema involuntarios.
# La BD ya existe en TimeFlow 0.4.x. Para instalaciones completamente nuevas,
# ejecutar backend/sql/esquema_timeflow.sql antes de iniciar la aplicacion.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT: no existe una clave de respaldo dentro del repositorio.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Origen permitido para el frontend. Puede sobreescribirse con CORS_ALLOWED_ORIGINS
# separando varios orígenes con coma.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Evita exponer detalles internos de excepciones en respuestas HTTP genéricas.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Limita cabeceras excesivamente grandes.
server.max-http-request-header-size=16KB

# Solo se utiliza si la base de datos no contiene usuarios.
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:admin@teamflow.com}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}
